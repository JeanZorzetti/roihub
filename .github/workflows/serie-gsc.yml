name: Série do GSC

on:
  schedule:
    # 05:17 BRT (8:17 UTC, sem horário de verão) — FORA das duas janelas do Princípio IV:
    # 23:30-01:00 BRT (estado noturno + autopublish) e 08:00-08:45 BRT (cron do autopublish).
    # Não compete com nenhuma delas pelo container, e o horário do dia é indiferente para o
    # dado: o GSC fecha o dia com ~3 dias de atraso, então não existe "cedo demais" aqui.
    # Fora do minuto :00 a fila do Actions é menor.
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  serie:
    runs-on: ubuntu-latest
    steps:
      # Sem checkout e sem Node: o trabalho é server-side porque o runner do GitHub não tem
      # GOOGLE_SERVICE_ACCOUNT_JSON nem DATABASE_URL. Aqui é só o gatilho.
      #
      # 🚩 O hub fica INTERMITENTEMENTE INACESSÍVEL na madrugada e o Actions atrasa o
      # agendamento em ~1h40 — ou seja, este job pode acabar caindo perto daquela janela mesmo
      # marcado para 05:17. O retry abaixo é o mesmo de `estado-noturno.yml`, e pelo mesmo motivo.
      #
      # Retry SÓ em falha de conexão, nunca em erro HTTP: sem resposta HTTP o trabalho não
      # começou, então repetir é de graça. Um 500 repetido re-executaria a corrida.
      # A corrida é idempotente (PK (projeto, dia) com DO UPDATE), então repetir é seguro.
      - name: Dispara a corrida e falha se o hub recusar
        run: |
          for tentativa in 1 2 3 4 5; do
            corpo=$(curl -sS -X POST "$HUB_URL/api/gsc-serie" \
              -H "authorization: Bearer $HUB_CRON_SECRET" \
              -w '\n%{http_code}' --max-time 360) && break
            saida=$?
            # 7 couldn't connect · 28 timeout · 35 TLS · 52 vazio · 56 recv falhou
            case $saida in
              7|28|35|52|56) ;;
              *) echo "::error::curl saiu $saida — não é falha de conexão, não repete"; exit 1 ;;
            esac
            [ "$tentativa" = "5" ] && { echo "::error::hub inacessível em 5 tentativas"; exit 1; }
            echo "tentativa $tentativa: curl saiu $saida (hub fora do ar), esperando 120s"
            sleep 120
          done
          codigo=$(printf '%s' "$corpo" | tail -n1)
          printf '%s\n' "$corpo" | sed '$d'
          [ "$codigo" = "200" ] || { echo "::error::hub devolveu HTTP $codigo"; exit 1; }
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_CRON_SECRET: ${{ secrets.HUB_CRON_SECRET }}
