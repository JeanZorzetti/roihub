name: Indexação do sitemap

on:
  schedule:
    # 05:47 BRT (8:47 UTC, sem horário de verão) — FORA das duas janelas do Princípio IV:
    # 23:30-01:00 BRT (estado noturno + autopublish) e 08:00-08:45 BRT (cron do autopublish).
    # 30 min depois da série da 021 (05:17) de propósito: as duas falam com o mesmo Search Console
    # com a mesma credencial, e dividir o container e a cota do Google no mesmo instante trocaria
    # dois trabalhos que funcionam por dois que se atrapalham.
    #
    # O horário do dia é indiferente para o dado: indexação se move em dias e semanas.
    - cron: "47 8 * * *"
  workflow_dispatch:

jobs:
  indexacao:
    runs-on: ubuntu-latest
    steps:
      # Sem checkout e sem Node: o trabalho é server-side porque o runner do GitHub não tem
      # GOOGLE_SERVICE_ACCOUNT_JSON nem DATABASE_URL. Aqui é só o gatilho.
      #
      # 🚩 O hub fica INTERMITENTEMENTE INACESSÍVEL na madrugada e o Actions atrasa o agendamento
      # em ~1h40 — este job pode acabar caindo perto daquela janela mesmo marcado para 05:47.
      #
      # Retry SÓ quando o trabalho comprovadamente NÃO começou. Diferente de `serie-gsc.yml`, aqui
      # o TIMEOUT (28) está FORA da lista de repetição, e isso é a lição da primeira corrida
      # (07/09/2026): aquela série termina em segundos, então um timeout lá é "não começou"; esta
      # corrida pode legitimamente passar do `--max-time`, e ali o timeout é "está rodando e
      # demorou". Repetir gastaria a quota DE NOVO, numa corrida que continua viva no servidor —
      # e a quota é o recurso escasso desta feature, compartilhada por 21 projetos.
      #
      # --max-time 780 abaixo do maxDuration 800 da rota: o curl desiste DEPOIS do servidor, senão
      # o Actions reportaria falha numa corrida que terminou bem.
      - name: Dispara a corrida e falha se o hub recusar
        run: |
          for tentativa in 1 2 3 4 5; do
            corpo=$(curl -sS -X POST "$HUB_URL/api/indexacao" \
              -H "authorization: Bearer $HUB_CRON_SECRET" \
              -w '\n%{http_code}' --max-time 780) && break
            saida=$?
            # 7 couldn't connect · 35 TLS · 52 vazio — o hub não atendeu, nada rodou.
            # 28 (timeout) NÃO entra: ver o comentário acima. 56 (recv falhou) também não — a
            # conexão foi aceita, então a corrida já estava em andamento do outro lado.
            case $saida in
              7|35|52) ;;
              28) echo "::error::curl expirou em 780s — a corrida pode estar VIVA no servidor. Não repete: conferir hub_indexacao antes de disparar de novo"; exit 1 ;;
              *) echo "::error::curl saiu $saida — não é falha de conexão, não repete"; exit 1 ;;
            esac
            [ "$tentativa" = "5" ] && { echo "::error::hub inacessível em 5 tentativas"; exit 1; }
            echo "tentativa $tentativa: curl saiu $saida (hub fora do ar), esperando 120s"
            sleep 120
          done
          codigo=$(printf '%s' "$corpo" | tail -n1)
          printf '%s\n' "$corpo" | sed '$d'
          [ "$codigo" = "200" ] || { echo "::error::hub devolveu HTTP $codigo"; exit 1; }
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_CRON_SECRET: ${{ secrets.HUB_CRON_SECRET }}
