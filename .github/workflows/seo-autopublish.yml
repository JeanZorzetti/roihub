name: SEO autopublish

on:
  schedule:
    # 08:17 BRT. Na hora cheia o schedule do Actions atrasa e às vezes nem chega a
    # criar o run: em 25/07 o "0 11" não rodou. Fora do minuto :00 a fila é menor.
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/run-autopublish.mjs
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_CRON_SECRET: ${{ secrets.HUB_CRON_SECRET }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
